<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>SHOOTING GALAXY 集計</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #000000;
    color: #ffffff;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    font-size: 38px;
    margin: 20px 0 10px;
}

#status {
    font-size: 20px;
    margin: 15px 0 25px;
}


/* =========================
   総合ランキング
========================= */

.tableArea {
    width: 100%;
    overflow-x: auto;
}

table {
    border-collapse: collapse;
    width: 100%;
    min-width: 700px;
    margin: 0 auto;
}

th,
td {
    border: 2px solid #ffffff;
    padding: 12px 10px;
    font-size: 18px;
    text-align: center;
}

th {
    background: #222222;
}

.total {
    font-size: 22px;
    font-weight: bold;
}


/* =========================
   順位
========================= */

.rank {
    font-size: 24px;
    font-weight: bold;
}


/* =========================
   詳細
========================= */

#detailsArea {
    margin-top: 40px;
}

.challengerTitle {
    font-size: 28px;
    margin-top: 45px;
    margin-bottom: 15px;
}


/* =========================
   データなし
========================= */

#noData {
    display: none;
    font-size: 22px;
    margin-top: 50px;
}


/* =========================
   更新ボタン
========================= */

button {
    font-size: 20px;
    padding: 12px 25px;
    margin: 30px 10px;
    border-radius: 10px;
    border: 2px solid #ffffff;
    background: #000000;
    color: #ffffff;
}

button:active {
    background: #ffffff;
    color: #000000;
}


/* =========================
   iPad用
========================= */

@media (max-width: 700px) {

    h1 {
        font-size: 30px;
    }

    th,
    td {
        font-size: 16px;
        padding: 10px 8px;
    }

    .total {
        font-size: 19px;
    }

}

</style>

</head>


<body>


<h1>
SHOOTING GALAXY 集計
</h1>


<div id="status">
Firebase接続中...
</div>


<!-- =========================
     総合ランキング
========================= -->

<div class="tableArea">

<table>

<thead>

<tr>

<th>順位</th>

<th>Challenger</th>

<th>台1</th>

<th>台2</th>

<th>台3</th>

<th>総合計</th>

</tr>

</thead>


<tbody id="rankingBody">

</tbody>

</table>

</div>


<div id="noData">
まだ得点データがありません。
</div>


<!-- =========================
     詳細
========================= -->

<div id="detailsArea">
</div>


<!-- =========================
     更新ボタン
========================= -->

<button onclick="location.reload()">
画面を更新
</button>


<!-- =========================
     Firebase
========================= -->

<script type="module">


/* =========================
   Firebase SDK
========================= */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {
    getDatabase,
    ref,
    onValue
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


/* =========================
   Firebase設定
========================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyBrv8InAGFNSMj1CSrem9Q8CxeQkzrfCg",

    authDomain:
        "shooting-galaxy.firebaseapp.com",

    databaseURL:
        "https://shooting-galaxy-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
        "shooting-galaxy",

    storageBucket:
        "shooting-galaxy.firebasestorage.app",

    messagingSenderId:
        "294093816088",

    appId:
        "1:294093816088:web:a18a7966391d60e2209e6d"

};


/* =========================
   Firebase開始
========================= */

const app =
    initializeApp(firebaseConfig);


const database =
    getDatabase(app);


/* =========================
   scoresを取得
========================= */

const scoresRef =
    ref(database, "scores");


onValue(

    scoresRef,

    function(snapshot) {

        const data =
            snapshot.val();


        console.log("Firebaseデータ:", data);


        if (!data) {

            document.getElementById(
                "status"
            ).textContent =
                "まだデータがありません";

            document.getElementById(
                "rankingBody"
            ).innerHTML = "";

            document.getElementById(
                "detailsArea"
            ).innerHTML = "";

            document.getElementById(
                "noData"
            ).style.display = "block";

            return;

        }


        document.getElementById(
            "status"
        ).textContent =
            "リアルタイム集計中";


        document.getElementById(
            "noData"
        ).style.display = "none";


        createRanking(data);

        createDetails(data);

    },


    function(error) {

        console.error(
            "Firebase読み込みエラー:",
            error
        );


        document.getElementById(
            "status"
        ).textContent =
            "Firebase読み込みエラー";

    }

);


/* =========================
   数字に変換
========================= */

function toNumber(value) {

    const number =
        Number(value);

    if (isNaN(number)) {

        return 0;

    }

    return number;

}


/* =========================
   総合ランキング
========================= */

function createRanking(data) {

    const challengers = [];


    /*
       Challengerごとに処理
    */

    Object.keys(data).forEach(

        function(participant) {

            const participantData =
                data[participant];


            let station1 = 0;

            let station2 = 0;

            let station3 = 0;


            /* 台1 */

            if (
                participantData &&
                participantData["台1"]
            ) {

                station1 =
                    toNumber(
                        participantData["台1"]
                            .totalScore
                    );

            }


            /* 台2 */

            if (
                participantData &&
                participantData["台2"]
            ) {

                station2 =
                    toNumber(
                        participantData["台2"]
                            .totalScore
                    );

            }


            /* 台3 */

            if (
                participantData &&
                participantData["台3"]
            ) {

                station3 =
                    toNumber(
                        participantData["台3"]
                            .totalScore
                    );

            }


            /* 3台の合計 */

            const total =

                station1 +
                station2 +
                station3;


            challengers.push({

                participant:
                    participant,

                station1:
                    station1,

                station2:
                    station2,

                station3:
                    station3,

                total:
                    total

            });

        }

    );


    /*
       総合計の高い順
    */

    challengers.sort(

        function(a, b) {

            return b.total - a.total;

        }

    );


    const rankingBody =
        document.getElementById(
            "rankingBody"
        );


    rankingBody.innerHTML = "";


    challengers.forEach(

        function(item, index) {

            const row =
                document.createElement("tr");


            row.innerHTML =

                "<td class='rank'>" +

                (index + 1) +

                "</td>" +


                "<td>" +

                escapeHTML(
                    item.participant
                ) +

                "</td>" +


                "<td>" +

                item.station1 +

                "点</td>" +


                "<td>" +

                item.station2 +

                "点</td>" +


                "<td>" +

                item.station3 +

                "点</td>" +


                "<td class='total'>" +

                item.total +

                "点</td>";


            rankingBody.appendChild(row);

        }

    );

}


/* =========================
   ラウンド別詳細
========================= */

function createDetails(data) {

    const area =
        document.getElementById(
            "detailsArea"
        );


    area.innerHTML = "";


    /*
       Challenger番号を数字順にする

       001
       002
       003
    */

    const participants =
        Object.keys(data).sort(

            function(a, b) {

                return Number(a) - Number(b);

            }

        );


    participants.forEach(

        function(participant) {

            const participantData =
                data[participant];


            /* Challengerタイトル */

            const title =
                document.createElement("div");


            title.className =
                "challengerTitle";


            title.textContent =
                "Challenger " +
                participant;


            area.appendChild(title);


            /* 表 */

            const tableArea =
                document.createElement("div");


            tableArea.className =
                "tableArea";


            const table =
                document.createElement("table");


            table.innerHTML =

                "<thead>" +

                "<tr>" +

                "<th>台</th>" +

                "<th>1回目</th>" +

                "<th>2回目</th>" +

                "<th>3回目</th>" +

                "<th>合計</th>" +

                "</tr>" +

                "</thead>" +


                "<tbody></tbody>";


            const tbody =
                table.querySelector(
                    "tbody"
                );


            let totalRound1 = 0;

            let totalRound2 = 0;

            let totalRound3 = 0;

            let totalAll = 0;


            /*
               台1～台3
            */

            ["台1", "台2", "台3"].forEach(

                function(station) {

                    let round1 = 0;

                    let round2 = 0;

                    let round3 = 0;

                    let total = 0;


                    if (
                        participantData &&
                        participantData[station]
                    ) {

                        const stationData =
                            participantData[
                                station
                            ];


                        /*
                           roundScores

                           [0] = 1回目
                           [1] = 2回目
                           [2] = 3回目
                        */

                        if (
                            stationData.roundScores
                        ) {

                            round1 =
                                toNumber(
                                    stationData
                                        .roundScores[0]
                                );


                            round2 =
                                toNumber(
                                    stationData
                                        .roundScores[1]
                                );


                            round3 =
                                toNumber(
                                    stationData
                                        .roundScores[2]
                                );

                        }


                        /*
                           totalScore
                        */

                        total =
                            toNumber(
                                stationData
                                    .totalScore
                            );

                    }


                    totalRound1 +=
                        round1;

                    totalRound2 +=
                        round2;

                    totalRound3 +=
                        round3;

                    totalAll +=
                        total;


                    const row =
                        document.createElement("tr");


                    row.innerHTML =

                        "<td>" +

                        station +

                        "</td>" +


                        "<td>" +

                        round1 +

                        "点</td>" +


                        "<td>" +

                        round2 +

                        "点</td>" +


                        "<td>" +

                        round3 +

                        "点</td>" +


                        "<td class='total'>" +

                        total +

                        "点</td>";


                    tbody.appendChild(row);

                }

            );


            /*
               3台合計
            */

            const totalRow =
                document.createElement("tr");


            totalRow.innerHTML =

                "<th>3台合計</th>" +


                "<th>" +

                totalRound1 +

                "点</th>" +


                "<th>" +

                totalRound2 +

                "点</th>" +


                "<th>" +

                totalRound3 +

                "点</th>" +


                "<th class='total'>" +

                totalAll +

                "点</th>";


            tbody.appendChild(totalRow);


            tableArea.appendChild(table);

            area.appendChild(tableArea);

        }

    );

}


/* =========================
   HTML安全対策
========================= */

function escapeHTML(value) {

    return String(value)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}


</script>


</body>

</html>
