<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>GALAXY SHOTTER 集計</title>

<style>

body {

    margin: 0;

    padding: 20px;

    background: #000000;

    color: #ffffff;

    font-family: Arial, sans-serif;

}

h1 {

    text-align: center;

    font-size: 40px;

    margin-bottom: 30px;

}

h2 {

    margin-top: 40px;

    border-bottom: 2px solid #ffffff;

    padding-bottom: 10px;

}

.status {

    text-align: center;

    font-size: 20px;

    margin: 20px;

}

.deleteAllArea {

    text-align: center;

    margin: 30px 0;

}

button {

    font-size: 18px;

    padding: 12px 20px;

    margin: 5px;

    border-radius: 10px;

    border: 2px solid #ffffff;

    background: #000000;

    color: #ffffff;

}

button:active {

    background: #ffffff;

    color: #000000;

}

.deleteButton {

    font-size: 15px;

    padding: 8px 12px;

}

table {

    width: 100%;

    border-collapse: collapse;

    margin-bottom: 30px;

    background: #000000;

}

th,
td {

    border: 1px solid #ffffff;

    padding: 10px;

    text-align: center;

}

th {

    background: #222222;

}

.total {

    font-size: 24px;

    font-weight: bold;

}

.noData {

    text-align: center;

    font-size: 22px;

    margin: 40px;

}

</style>

</head>


<body>


<h1>GALAXY SHOTTER 集計</h1>


<div id="status"
     class="status">

Firebase接続中...

</div>


<!-- 全データ削除 -->

<div class="deleteAllArea">

<button
    onclick="deleteAllData()">

🗑 全データ削除

</button>

</div>


<!-- 総合ランキング -->

<h2>🏆 総合ランキング</h2>


<div id="ranking">

</div>


<!-- Challenger詳細 -->

<h2>Challenger別 詳細</h2>


<div id="details">

</div>


<!-- Firebase -->

<script type="module">


import { initializeApp }

from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {

    getDatabase,

    ref,

    onValue,

    remove

}

from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";



/* =========================
   Firebase設定
========================= */


const firebaseConfig = {

    apiKey:
        "AIzaSyBrv8In8AGaFNSMj1CSremQ8CxeQkzrfCg",

    authDomain:
        "shooting-galaxy.firebaseapp.com",

    databaseURL:
        "https://shooting-galaxy-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
        "shooting-galaxy",

    storageBucket:
        "shooting-galaxy.firebasestorage.app",

    messagingSenderId:
        "294093816088",

    appId:
        "1:294093816088:web:a18a7966391d60e2209e6d"

};



/* =========================
   Firebase開始
========================= */


const app =
    initializeApp(firebaseConfig);


const database =
    getDatabase(app);


const scoresRef =
    ref(database, "scores");



/* =========================
   データ読み込み
========================= */


onValue(

    scoresRef,

    function(snapshot) {


        const data =
            snapshot.val();


        document.getElementById("status")
            .textContent =
            "リアルタイム集計中";


        createRanking(data);


        createDetails(data);


    },

    function(error) {


        console.error(error);


        document.getElementById("status")
            .textContent =
            "Firebase読み込みエラー";


    }

);



/* =========================
   総合ランキング
========================= */


function createRanking(data) {


    const area =
        document.getElementById("ranking");


    area.innerHTML = "";


    if (!data) {


        area.innerHTML =
            '<div class="noData">まだ得点データがありません。</div>';


        return;

    }


    const ranking = [];


    Object.keys(data).forEach(

        function(participant) {


            const participantData =
                data[participant];


            let station1 = 0;

            let station2 = 0;

            let station3 = 0;


            if (participantData["台1"]) {

                station1 =
                    Number(
                        participantData["台1"].totalScore
                    ) || 0;

            }


            if (participantData["台2"]) {

                station2 =
                    Number(
                        participantData["台2"].totalScore
                    ) || 0;

            }


            if (participantData["台3"]) {

                station3 =
                    Number(
                        participantData["台3"].totalScore
                    ) || 0;

            }


            const total =
                station1 +
                station2 +
                station3;


            ranking.push({

                participant:
                    participant,

                station1:
                    station1,

                station2:
                    station2,

                station3:
                    station3,

                total:
                    total

            });


        }

    );


    ranking.sort(

        function(a, b) {

            return b.total - a.total;

        }

    );


    let html = `

<table>

<tr>

<th>順位</th>

<th>Challenger</th>

<th>台1</th>

<th>台2</th>

<th>台3</th>

<th>総合計</th>

<th>削除</th>

</tr>

`;


    ranking.forEach(

        function(item, index) {


            html += `

<tr>

<td>
${index + 1}
</td>

<td>
${item.participant}
</td>

<td>
${item.station1}
</td>

<td>
${item.station2}
</td>

<td>
${item.station3}
</td>

<td class="total">
${item.total}
</td>

<td>

<button
    class="deleteButton"
    onclick="deleteParticipant('${item.participant}')">

🗑 削除

</button>

</td>

</tr>

`;


        }

    );


    html += `

</table>

`;


    area.innerHTML =
        html;

}



/* =========================
   Challenger詳細
========================= */


function createDetails(data) {


    const area =
        document.getElementById("details");


    area.innerHTML = "";


    if (!data) {

        return;

    }


    Object.keys(data).forEach(

        function(participant) {


            const participantData =
                data[participant];


            let html = `

<h3>

Challenger ${participant}

</h3>

<table>

<tr>

<th>台</th>

<th>1回目</th>

<th>2回目</th>

<th>3回目</th>

<th>合計</th>

</tr>

`;


            let grandTotal = 0;


            ["台1", "台2", "台3"].forEach(

                function(station) {


                    const stationData =
                        participantData[station];


                    if (!stationData) {

                        return;

                    }


                    const rounds =
                        stationData.roundScores ||
                        [0, 0, 0];


                    const round1 =
                        Number(rounds[0]) || 0;


                    const round2 =
                        Number(rounds[1]) || 0;


                    const round3 =
                        Number(rounds[2]) || 0;


                    const total =
                        Number(
                            stationData.totalScore
                        ) || 0;


                    grandTotal += total;


                    html += `

<tr>

<td>
${station}
</td>

<td>
${round1}
</td>

<td>
${round2}
</td>

<td>
${round3}
</td>

<td class="total">
${total}
</td>

</tr>

`;

                }

            );


            html += `

<tr>

<td colspan="4"
    class="total">

3台合計

</td>

<td class="total">

${grandTotal}

</td>

</tr>

</table>

`;


            area.innerHTML +=
                html;

        }

    );

}



/* =========================
   Challenger削除
========================= */


window.deleteParticipant =
    function(participant) {


        const answer =
            confirm(

                "Challenger " +
                participant +
                " のデータを全部削除しますか？"

            );


        if (!answer) {

            return;

        }


        remove(

            ref(
                database,
                "scores/" + participant
            )

        )

        .then(

            function() {

                alert(
                    "Challenger " +
                    participant +
                    " のデータを削除しました。"
                );

            }

        )

        .catch(

            function(error) {

                console.error(error);

                alert(
                    "削除に失敗しました。"
                );

            }

        );

    };



/* =========================
   全データ削除
========================= */


window.deleteAllData =
    function() {


        const answer1 =
            confirm(
                "本当に全Challengerのデータを削除しますか？"
            );


        if (!answer1) {

            return;

        }


        const answer2 =
            confirm(
                "⚠️ この操作は元に戻せません。本当に削除しますか？"
            );


        if (!answer2) {

            return;

        }


        remove(

            ref(
                database,
                "scores"
            )

        )

        .then(

            function() {

                alert(
                    "全データを削除しました。"
                );

            }

        )

        .catch(

            function(error) {

                console.error(error);

                alert(
                    "削除に失敗しました。"
                );

            }

        );

    };


</script>


</body>

</html>
