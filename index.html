<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SHOOTINGGALAXY</title>

<style>
body {
    font-family: sans-serif;
    text-align: center;
    margin: 0;
    padding: 20px;
    background: #eeeeee;
}

h1 {
    font-size: 42px;
}

#round {
    font-size: 30px;
    font-weight: bold;
    margin: 15px;
}

#timer {
    font-size: 70px;
    font-weight: bold;
    margin: 15px;
}

#score {
    font-size: 80px;
    font-weight: bold;
    margin: 20px;
}

#shots {
    font-size: 30px;
    margin-bottom: 25px;
}

button {
    font-size: 30px;
    padding: 25px;
    margin: 10px;
    border-radius: 15px;
    border: none;
}

.scoreButton {
    min-width: 150px;
}

#miss {
    width: 330px;
}

#start {
    font-size: 35px;
    background: #dddddd;
}

#nextRound {
    font-size: 30px;
    display: none;
}

#reset {
    font-size: 25px;
    margin-top: 25px;
}

#results {
    font-size: 25px;
    margin-top: 25px;
}

#status {
    font-size: 28px;
    font-weight: bold;
    margin: 20px;
}
</style>
</head>

<body>
    body {
    font-family: sans-serif;
    text-align: center;
    margin: 0;
    padding: 20px;
    background: #000000;
    color: white;
}

<h1>SHOOTING GALAXY</h1>

<div id="round">第1回 / 全3回</div>

<div id="timer">50秒</div>

<div id="status">集計開始</div>

<div id="score">0 点</div>

<div id="shots">発射数：0</div>

<div>
    <button class="scoreButton" onclick="addScore(10)">10点</button>
    <button class="scoreButton" onclick="addScore(20)">20点</button>
</div>

<div>
    <button class="scoreButton" onclick="addScore(30)">30点</button>
    <button class="scoreButton" onclick="addScore(50)">50点</button>
</div>

<div>
    <button class="scoreButton" onclick="addScore(100)">100点</button>
</div>

<div>
    <button id="miss" onclick="miss()">ミス</button>
</div>

<button id="start" onclick="startGame()">▶️ ゲーム開始</button>

<button id="nextRound" onclick="nextRound()">➡️ 次の回へ</button>

<button id="reset" onclick="resetGame()">🔄 次のお客さん</button>

<div id="results">
    第1回：0点<br>
    第2回：0点<br>
    第3回：0点<br>
    <br>
     合計：0点
</div>

<script>

let currentRound = 1;
let timeLeft = 50;
let score = 0;
let shots = 0;

let roundScores = [0, 0, 0];

let timer = null;
let gameRunning = false;


// 画面を更新
function updateDisplay() {

    document.getElementById("round").textContent =
        "第" + currentRound + "回 / 全3回";

    document.getElementById("timer").textContent =
        timeLeft + "秒";

    document.getElementById("score").textContent =
        score + " 点";

    document.getElementById("shots").textContent =
        "発射数：" + shots;

    document.getElementById("results").innerHTML =
        "第1回：" + roundScores[0] + "点<br>" +
        "第2回：" + roundScores[1] + "点<br>" +
        "第3回：" + roundScores[2] + "点<br><br>" +
        " 合計：" +
        (roundScores[0] + roundScores[1] + roundScores[2]) +
        "点";
}


// ゲーム開始
function startGame() {

    if (gameRunning) return;

    gameRunning = true;

    timeLeft = 50;
    score = 0;
    shots = 0;

    document.getElementById("status").textContent =
        "none";

    document.getElementById("start").style.display =
        "none";

    document.getElementById("nextRound").style.display =
        "none";

    updateDisplay();

    timer = setInterval(function() {

        timeLeft--;

        updateDisplay();

        if (timeLeft <= 0) {
            endGame();
        }

    }, 1000);
}


// ゲーム終了
function endGame() {

    clearInterval(timer);

    gameRunning = false;

    roundScores[currentRound - 1] = score;

    document.getElementById("status").textContent =
        "第" + currentRound + "回終了！";

    updateDisplay();

    if (currentRound < 3) {

        document.getElementById("nextRound").style.display =
            "inline-block";

    } else {

        document.getElementById("status").textContent =
            " 3回終了！";

    }
}


// 得点
function addScore(points) {

    if (!gameRunning) return;

    score += points;
    shots++;

    updateDisplay();
}


// ミス
function miss() {

    if (!gameRunning) return;

    shots++;

    updateDisplay();
}


// 次の回
function nextRound() {

    if (gameRunning) return;

    currentRound++;

    timeLeft = 50;
    score = 0;
    shots = 0;

    document.getElementById("status").textContent =
        "ゲーム開始を押してください";

    document.getElementById("nextRound").style.display =
        "none";

    document.getElementById("start").style.display =
        "inline-block";

    updateDisplay();
}


// NEXT CHALLENGER
function resetGame() {

    clearInterval(timer);

    currentRound = 1;
    timeLeft = 50;
    score = 0;
    shots = 0;

    roundScores = [0, 0, 0];

    gameRunning = false;

    document.getElementById("status").textContent =
        "ゲーム開始を押してください";

    document.getElementById("start").style.display =
        "inline-block";

    document.getElementById("nextRound").style.display =
        "none";

    updateDisplay();
}


// 最初の表示
updateDisplay();

</script>

</body>
</html>
