<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GALAXY SHOTTER</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #050816;
            color: white;
            text-align: center;
        }

        .container {
            max-width: 700px;
            margin: auto;
            padding: 20px;
        }

        h1 {
            font-size: 42px;
            margin: 10px 0 25px;
        }

        .input-area {
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 15px;
            font-size: 22px;
            text-align: center;
            border-radius: 10px;
            border: none;
        }

        .station-area {
            margin: 15px 0;
        }

        select {
            padding: 12px 20px;
            font-size: 20px;
            border-radius: 10px;
        }

        .round {
            font-size: 30px;
            margin: 15px 0;
        }

        .score {
            font-size: 60px;
            font-weight: bold;
            margin: 10px 0;
        }

        .stats {
            font-size: 22px;
            margin: 10px 0 20px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 20px;
        }

        button {
            padding: 20px 10px;
            font-size: 25px;
            font-weight: bold;
            border: none;
            border-radius: 15px;
            cursor: pointer;
        }

        .score10 {
            background: #2196f3;
            color: white;
        }

        .score50 {
            background: #ff9800;
            color: white;
        }

        .score100 {
            background: #f44336;
            color: white;
        }

        .miss {
            background: #555;
            color: white;
        }

        .end {
            width: 100%;
            margin-top: 20px;
            background: #9c27b0;
            color: white;
        }

        .summary {
            margin-top: 25px;
            padding: 20px;
            border-radius: 15px;
            background: #111a33;
        }

        .summary h2 {
            margin-top: 0;
        }

        .round-result {
            font-size: 20px;
            margin: 8px 0;
        }

        .status {
            margin-top: 15px;
            font-size: 18px;
            min-height: 25px;
        }

        @media (max-width: 500px) {

            h1 {
                font-size: 32px;
            }

            .score {
                font-size: 50px;
            }

            button {
                font-size: 21px;
                padding: 18px 8px;
            }

        }

    </style>

</head>


<body>

<div class="container">

    <h1>🌌 GALAXY SHOTTER 🌌</h1>


    <!-- Challenger番号 -->

    <div class="input-area">

        <input
            type="text"
            id="participantNumber"
            placeholder="Challenger番号"
            inputmode="numeric"
            maxlength="4"
            oninput="this.value = this.value.replace(/[^0-9]/g, '')"
        >

    </div>


    <!-- 台番号 -->

    <div class="station-area">

        <select id="station">

            <option value="台1">台1</option>

            <option value="台2">台2</option>

            <option value="台3">台3</option>

        </select>

    </div>


    <!-- ラウンド -->

    <div
        class="round"
        id="roundDisplay">

        ラウンド 1 / 3

    </div>


    <!-- 現在スコア -->

    <div
        class="score"
        id="score">

        0

    </div>


    <!-- SHOT・HIT・HIT率 -->

    <div class="stats">

        SHOT：
        <span id="shots">0</span>

       　

        HIT：
        <span id="hits">0</span>

       　

        HIT率：
        <span id="hitRate">0%</span>

    </div>


    <!-- スコアボタン -->

    <div class="buttons">


        <button
            class="score10"
            onclick="addScore(10)">

            +10

        </button>


        <button
            class="score50"
            onclick="addScore(50)">

            +50

        </button>


        <button
            class="score100"
            onclick="addScore(100)">

            +100

        </button>


        <button
            class="miss"
            onclick="miss()">

            MISS

        </button>


    </div>


    <!-- ラウンド終了 -->

    <button
        class="end"
        onclick="endGame()">

        ラウンド終了

    </button>


    <!-- 3ラウンド結果 -->

    <div class="summary">

        <h2>🏆 3ラウンド結果</h2>


        <div class="round-result">

            1回目：

            <span id="round1Score">0</span>点

            /

            <span id="round1HitRate">0%</span>

        </div>


        <div class="round-result">

            2回目：

            <span id="round2Score">0</span>点

            /

            <span id="round2HitRate">0%</span>

        </div>


        <div class="round-result">

            3回目：

            <span id="round3Score">0</span>点

            /

            <span id="round3HitRate">0%</span>

        </div>


        <hr>


        <div class="round-result">

            合計：

            <strong>

                <span id="totalScore">0</span>点

            </strong>

        </div>


        <div class="round-result">

            3回合計HIT率：

            <strong>

                <span id="totalHitRate">0%</span>

            </strong>

        </div>


    </div>


    <div
        class="status"
        id="status">

    </div>


</div>



<!-- Firebase -->

<script type="module">


    import {
        initializeApp
    }
    from
        "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


    import {
        getDatabase,
        ref,
        set
    }
    from
        "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


    // ========================================
    // Firebase設定
    // ========================================

    const firebaseConfig = {

        apiKey: "YOUR_FIREBASE_API_KEY",

        authDomain:
            "shooting-galaxy.firebaseapp.com",

        databaseURL:
            "https://shooting-galaxy-default-rtdb.asia-southeast1.firebasedatabase.app",

        projectId:
            "shooting-galaxy",

        storageBucket:
            "shooting-galaxy.firebasestorage.app",

        messagingSenderId:
            "294093816088",

        appId:
            "1:294093816088:web:a18a7966391d60e2209e6d"

    };


    // Firebase開始

    const app =
        initializeApp(firebaseConfig);

    const database =
        getDatabase(app);



    // ========================================
    // ゲームデータ
    // ========================================

    let currentRound = 1;

    let currentScore = 0;

    let shots = 0;

    let hits = 0;


    // 各ラウンドのデータ

    let roundScores = [
        0,
        0,
        0
    ];

    let roundShots = [
        0,
        0,
        0
    ];

    let roundHits = [
        0,
        0,
        0
    ];



    // ========================================
    // 画面要素
    // ========================================

    const scoreElement =
        document.getElementById("score");

    const shotsElement =
        document.getElementById("shots");

    const hitsElement =
        document.getElementById("hits");

    const hitRateElement =
        document.getElementById("hitRate");

    const roundDisplay =
        document.getElementById("roundDisplay");

    const statusElement =
        document.getElementById("status");



    // ========================================
    // HIT率計算
    // ========================================

    function calculateHitRate(hit, shot) {

        if (shot === 0) {

            return 0;

        }

        return Math.round(
            hit / shot * 100
        );

    }



    // ========================================
    // 画面更新
    // ========================================

    function updateDisplay() {


        scoreElement.textContent =
            currentScore;


        shotsElement.textContent =
            shots;


        hitsElement.textContent =
            hits;


        hitRateElement.textContent =
            calculateHitRate(
                hits,
                shots
            ) + "%";


        roundDisplay.textContent =
            "ラウンド " +
            currentRound +
            " / 3";



        // 1回目

        document.getElementById(
            "round1Score"
        ).textContent =
            roundScores[0];


        document.getElementById(
            "round1HitRate"
        ).textContent =
            calculateHitRate(
                roundHits[0],
                roundShots[0]
            ) + "%";



        // 2回目

        document.getElementById(
            "round2Score"
        ).textContent =
            roundScores[1];


        document.getElementById(
            "round2HitRate"
        ).textContent =
            calculateHitRate(
                roundHits[1],
                roundShots[1]
            ) + "%";



        // 3回目

        document.getElementById(
            "round3Score"
        ).textContent =
            roundScores[2];


        document.getElementById(
            "round3HitRate"
        ).textContent =
            calculateHitRate(
                roundHits[2],
                roundShots[2]
            ) + "%";



        // 合計

        const totalScore =
            roundScores[0] +
            roundScores[1] +
            roundScores[2];


        const totalShots =
            roundShots[0] +
            roundShots[1] +
            roundShots[2];


        const totalHits =
            roundHits[0] +
            roundHits[1] +
            roundHits[2];


        document.getElementById(
            "totalScore"
        ).textContent =
            totalScore;


        document.getElementById(
            "totalHitRate"
        ).textContent =
            calculateHitRate(
                totalHits,
                totalShots
            ) + "%";

    }



    // ========================================
    // スコア追加
    // ========================================

    window.addScore = function(points) {


        currentScore += points;


        shots++;

        hits++;


        roundScores[
            currentRound - 1
        ] += points;


        roundShots[
            currentRound - 1
        ]++;


        roundHits[
            currentRound - 1
        ]++;


        updateDisplay();

    };



    // ========================================
    // MISS
    // ========================================

    window.miss = function() {


        shots++;


        roundShots[
            currentRound - 1
        ]++;


        updateDisplay();

    };



    // ========================================
    // Challenger番号
    // ========================================

    function normalizeParticipantNumber() {


        const input =
            document.getElementById(
                "participantNumber"
            );


        const value =
            input.value.trim();


        if (value === "") {

            alert(
                "Challenger番号を入力してください。"
            );

            return null;

        }


        const number =
            Number(value);


        if (
            !Number.isInteger(number) ||
            number < 1 ||
            number > 9999
        ) {

            alert(
                "Challenger番号は1〜9999で入力してください。"
            );

            return null;

        }


        return String(number).padStart(
            4,
            "0"
        );

    }



    // ========================================
    // Firebase保存
    // ========================================

    async function saveToFirebase() {


        const participant =
            normalizeParticipantNumber();


        if (participant === null) {

            return false;

        }


        const station =
            document.getElementById(
                "station"
            ).value;



        const totalShots =
            roundShots[0] +
            roundShots[1] +
            roundShots[2];


        const totalHits =
            roundHits[0] +
            roundHits[1] +
            roundHits[2];


        const totalScore =
            roundScores[0] +
            roundScores[1] +
            roundScores[2];


        const totalHitRate =
            calculateHitRate(
                totalHits,
                totalShots
            );



        const data = {

            station:
                station,

            participant:
                participant,

            round:
                currentRound,

            score:
                currentScore,

            shots:
                shots,

            hits:
                hits,

            hitRate:
                calculateHitRate(
                    hits,
                    shots
                ),

            totalShots:
                totalShots,

            totalHits:
                totalHits,

            totalHitRate:
                totalHitRate,

            totalScore:
                totalScore,

            roundScores:
                roundScores,

            roundShots:
                roundShots,

            roundHits:
                roundHits,

            status:
                statusElement.textContent,

            updatedAt:
                Date.now()

        };



        try {


            await set(

                ref(
                    database,
                    "scores/" +
                    participant +
                    "/" +
                    station
                ),

                data

            );


            statusElement.textContent =
                "Firebaseに保存しました！";


            return true;


        } catch (error) {


            console.error(error);


            statusElement.textContent =
                "保存に失敗しました。";


            alert(
                "Firebaseへの保存に失敗しました。"
            );


            return false;

        }

    }



    // ========================================
    // ラウンド終了
    // ========================================

    window.endGame = async function() {


        if (shots === 0) {

            alert(
                "まだスコアが入力されていません。"
            );

            return;

        }



        const saved =
            await saveToFirebase();


        if (!saved) {

            return;

        }



        // 3ラウンド目

        if (currentRound === 3) {


            statusElement.textContent =
                "3ラウンド終了！結果を保存しました。";


            const total =
                roundScores[0] +
                roundScores[1] +
                roundScores[2];


            alert(
                "3ラウンド終了！\n\n" +
                "合計：" +
                total +
                "点"
            );


            return;

        }



        // 次のラウンド

        currentRound++;


        currentScore = 0;

        shots = 0;

        hits = 0;


        updateDisplay();


        statusElement.textContent =
            "次のラウンド開始！";

    };



    // ========================================
    // 初期表示
    // ========================================

    updateDisplay();

</script>

</body>

</html>
