<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GALAXY SHOTTER</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #000000;
    color: #ffffff;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    font-size: 42px;
    margin: 20px 0 30px;
}

#stationArea {
    margin: 20px auto;
    padding: 20px;
    max-width: 500px;
    border: 2px solid #ffffff;
    border-radius: 12px;
}

#stationTitle {
    font-size: 24px;
    margin-bottom: 12px;
}

#stationSelect {
    font-size: 25px;
    padding: 10px 20px;
    background: #000000;
    color: #ffffff;
    border: 2px solid #ffffff;
    border-radius: 8px;
}

#stationDisplay {
    font-size: 25px;
    margin: 20px;
}

#participantArea {
    margin: 20px;
}

#participantNumber {
    font-size: 25px;
    width: 220px;
    padding: 12px;
    text-align: center;
    background: #000000;
    color: #ffffff;
    border: 2px solid #ffffff;
    border-radius: 8px;
}

#participantDisplay {
    font-size: 24px;
    margin: 15px;
}

#status {
    font-size: 30px;
    font-weight: bold;
    margin: 25px;
}

#round {
    font-size: 30px;
    font-weight: bold;
    margin: 15px;
}

#timer {
    font-size: 75px;
    font-weight: bold;
    margin: 20px;
}

#score {
    font-size: 70px;
    font-weight: bold;
    margin: 20px;
}

#shots {
    font-size: 25px;
    margin-bottom: 10px;
}

#hitRateDisplay {
    font-size: 25px;
    margin-bottom: 20px;
}

button {
    font-size: 25px;
    padding: 18px 25px;
    margin: 8px;
    border-radius: 12px;
    border: 2px solid #ffffff;
    background: #000000;
    color: #ffffff;
}

button:active {
    background: #ffffff;
    color: #000000;
}

.scoreButtons {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
}

.scoreButton {
    min-width: 130px;
}

#miss {
    width: 290px;
}

#start {
    font-size: 30px;
    margin-top: 20px;
}

#nextRound {
    font-size: 25px;
}

#reset {
    font-size: 23px;
    margin-top: 25px;
}

#roundScores {
    font-size: 23px;
    line-height: 1.8;
    margin: 30px 0;
    padding-bottom: 30px;
}

</style>
</head>

<body>

<h1>GALAXY SHOTTER</h1>


<!-- =========================
     担当台
========================= -->

<div id="stationArea">

    <div id="stationTitle">
        担当台を選択
    </div>

    <select id="stationSelect" onchange="setStation()">

        <option value="">
            選択してください
        </option>

        <option value="台1">
            台1
        </option>

        <option value="台2">
            台2
        </option>

        <option value="台3">
            台3
        </option>

    </select>

</div>


<div id="stationDisplay">
    担当台：未設定
</div>


<!-- =========================
     Challenger番号
========================= -->

<div id="participantArea">

    <input
        type="text"
        id="participantNumber"
        placeholder="Challenger番号"
        inputmode="numeric"
        pattern="[0-9]*"
        maxlength="4"
        oninput="this.value = this.value.replace(/[^0-9]/g, '')"
    >

</div>


<div id="participantDisplay">
    Challenger番号：未入力
</div>


<!-- =========================
     状態
========================= -->

<div id="status">
    集計開始
</div>


<!-- =========================
     回数
========================= -->

<div id="round">
    1回目
</div>


<!-- =========================
     タイマー
========================= -->

<div id="timer">
    50
</div>


<!-- =========================
     得点
========================= -->

<div id="score">
    0
</div>


<!-- =========================
     発射数
========================= -->

<div id="shots">
    発射数：0
</div>


<!-- =========================
     HIT率
========================= -->

<div id="hitRateDisplay">
    HIT率：0%
</div>


<!-- =========================
     得点ボタン
========================= -->

<div class="scoreButtons">

    <button
        class="scoreButton"
        onclick="addScore(10)">
        10点
    </button>

    <button
        class="scoreButton"
        onclick="addScore(50)">
        +50
    </button>

    <button
        class="score100"
        onclick="addScore(100)">
        +100
    </button>

</div>


<!-- =========================
     MISS
========================= -->

<div>

    <button
        class="miss"
        onclick="miss()">
        MISS
    </button>

</div>


<!-- =========================
     集計開始
========================= -->

<div>

    <button
        id="start"
        onclick="startGame()">
        集計開始
    </button>

</div>


<!-- =========================
     次のラウンド
========================= -->

<div>

    <button
        id="nextRound"
        onclick="nextRound()"
        style="display:none;">
        次のラウンド
    </button>

</div>


<!-- =========================
     次のChallenger
========================= -->

<div>

    <button
        id="reset"
        onclick="nextCustomer()">
        次のChallenger
    </button>

</div>


<!-- =========================
     各回の結果
========================= -->

<div id="roundScores">

    1回目：0点 / HIT率：0%<br>
    2回目：0点 / HIT率：0%<br>
    3回目：0点 / HIT率：0%<br><br>

    合計：0点<br>

    3回合計HIT率：0%

</div>


<script>

/* =========================
   基本設定
========================= */

let station = "";

let currentRound = 1;

let timeLeft = 50;

let score = 0;

let shots = 0;

let hits = 0;

let timer = null;

let gameRunning = false;

let roundScores = [0, 0, 0];

let roundShots = [0, 0, 0];

let roundHits = [0, 0, 0];


/* =========================
   HTML要素
========================= */

const status =
    document.getElementById("status");

const timerDisplay =
    document.getElementById("timer");

const scoreDisplay =
    document.getElementById("score");

const roundDisplay =
    document.getElementById("round");

const shotsDisplay =
    document.getElementById("shots");

const hitRateDisplay =
    document.getElementById("hitRateDisplay");

const roundScoresDisplay =
    document.getElementById("roundScores");

const participantNumber =
    document.getElementById("participantNumber");

const participantDisplay =
    document.getElementById("participantDisplay");

const stationSelect =
    document.getElementById("stationSelect");

const stationDisplay =
    document.getElementById("stationDisplay");

const startButton =
    document.getElementById("start");

const nextRoundButton =
    document.getElementById("nextRound");


/* =========================
   HIT率更新
========================= */

function updateHitRate() {

    const rate =
        shots === 0
            ? 0
            : Math.round(
                hits / shots * 100
            );

    hitRateDisplay.textContent =
        "HIT率：" + rate + "%";

}


/* =========================
   Challenger番号チェック
========================= */

function normalizeParticipantNumber() {

    let value =
        participantNumber.value.trim();


    if (value === "") {

        alert(
            "Challenger番号を入力してください"
        );

        return false;
    }


    if (!/^[0-9]+$/.test(value)) {

        alert(
            "Challenger番号は数字で入力してください"
        );

        return false;
    }


    const number =
        Number(value);


    if (
        number < 1 ||
        number > 9999
    ) {

        alert(
            "Challenger番号は1〜9999で入力してください"
        );

        return false;
    }


    participantNumber.value =
        value.padStart(4, "0");


    return true;

}


/* =========================
   台番号設定
========================= */

function setStation() {

    station =
        stationSelect.value;


    if (station === "") {

        stationDisplay.textContent =
            "担当台：未設定";

        return;
    }


    stationDisplay.textContent =
        "担当台：" + station;

}


/* =========================
   集計開始
========================= */

function startGame() {

    if (gameRunning) {
        return;
    }


    if (station === "") {

        alert(
            "担当台を選択してください"
        );

        return;
    }


    /* Challenger番号を確認 */

    if (!normalizeParticipantNumber()) {
        return;
    }


    participantDisplay.textContent =
        "Challenger番号：" +
        participantNumber.value;


    gameRunning = true;


    timeLeft = 50;

    score = 0;

    shots = 0;

    hits = 0;


    roundShots[currentRound - 1] =
        0;

    roundHits[currentRound - 1] =
        0;


    scoreDisplay.textContent =
        score;

    shotsDisplay.textContent =
        "発射数：" + shots;

    updateHitRate();


    timerDisplay.textContent =
        timeLeft;


    status.textContent =
        "集計中";


    roundDisplay.textContent =
        currentRound + "回目";


    startButton.style.display =
        "none";


    nextRoundButton.style.display =
        "none";


    updateRoundScores();


    if (window.sendToFirebase) {

        window.sendToFirebase();

    }


    timer =
        setInterval(function() {

            timeLeft--;

            timerDisplay.textContent =
                timeLeft;


            if (timeLeft <= 0) {

                endGame();

            }

        }, 1000);

}


/* =========================
   得点追加
========================= */

function addScore(points) {

    if (!gameRunning) {
        return;
    }


    score += points;

    shots++;

    hits++;


    roundShots[currentRound - 1] =
        shots;

    roundHits[currentRound - 1] =
        hits;


    scoreDisplay.textContent =
        score;


    shotsDisplay.textContent =
        "発射数：" + shots;


    updateHitRate();

    updateRoundScores();


    if (window.sendToFirebase) {

        window.sendToFirebase();

    }

}


/* =========================
   MISS
========================= */

function miss() {

    if (!gameRunning) {
        return;
    }


    shots++;


    roundShots[currentRound - 1] =
        shots;

    roundHits[currentRound - 1] =
        hits;


    shotsDisplay.textContent =
        "発射数：" + shots;


    updateHitRate();

    updateRoundScores();


    if (window.sendToFirebase) {

        window.sendToFirebase();

    }

}


/* =========================
   ラウンド終了
========================= */

function endGame() {

    clearInterval(timer);

    timer = null;

    gameRunning = false;


    roundScores[currentRound - 1] =
        score;


    roundShots[currentRound - 1] =
        shots;


    roundHits[currentRound - 1] =
        hits;


    status.textContent =
        currentRound + "回 FINISH";


    updateRoundScores();


    if (currentRound < 3) {

        nextRoundButton.style.display =
            "inline-block";

    } else {

        status.textContent =
            "3回 FINISH";

    }


    if (window.sendToFirebase) {

        window.sendToFirebase();

    }

}


/* =========================
   次のラウンド
========================= */

function nextRound() {

    if (gameRunning) {
        return;
    }


    if (currentRound >= 3) {

        status.textContent =
            "3回 FINISH";

        return;
    }


    currentRound++;


    timeLeft = 50;

    score = 0;

    shots = 0;

    hits = 0;


    roundShots[currentRound - 1] =
        0;

    roundHits[currentRound - 1] =
        0;


    timerDisplay.textContent =
        timeLeft;


    scoreDisplay.textContent =
        score;


    shotsDisplay.textContent =
        "発射数：" + shots;


    updateHitRate();


    roundDisplay.textContent =
        currentRound + "回目";


    status.textContent =
        "集計開始";


    nextRoundButton.style.display =
        "none";


    startButton.style.display =
        "inline-block";


    updateRoundScores();


    if (window.sendToFirebase) {

        window.sendToFirebase();

    }

}


/* =========================
   次のChallenger
========================= */

function nextCustomer() {

    clearInterval(timer);

    timer = null;


    currentRound = 1;

    timeLeft = 50;

    score = 0;

    shots = 0;

    hits = 0;


    gameRunning = false;


    roundScores =
        [0, 0, 0];

    roundShots =
        [0, 0, 0];

    roundHits =
        [0, 0, 0];


    participantNumber.value =
        "";


    participantDisplay.textContent =
        "Challenger番号：未入力";


    timerDisplay.textContent =
        timeLeft;


    scoreDisplay.textContent =
        score;


    shotsDisplay.textContent =
        "発射数：0";


    updateHitRate();


    roundDisplay.textContent =
        "1回目";


    status.textContent =
        "集計開始";


    startButton.style.display =
        "inline-block";


    nextRoundButton.style.display =
        "none";


    updateRoundScores();

}


/* =========================
   各回の得点・HIT率表示
========================= */

function updateRoundScores() {

    const totalScore =
        roundScores[0] +
        roundScores[1] +
        roundScores[2];


    const totalShots =
        roundShots[0] +
        roundShots[1] +
        roundShots[2];


    const totalHits =
        roundHits[0] +
        roundHits[1] +
        roundHits[2];


    const totalHitRate =
        totalShots === 0
            ? 0
            : Math.round(
                totalHits /
                totalShots *
                100
            );


    const round1Rate =
        roundShots[0] === 0
            ? 0
            : Math.round(
                roundHits[0] /
                roundShots[0] *
                100
            );


    const round2Rate =
        roundShots[1] === 0
            ? 0
            : Math.round(
                roundHits[1] /
                roundShots[1] *
                100
            );


    const round3Rate =
        roundShots[2] === 0
            ? 0
            : Math.round(
                roundHits[2] /
                roundShots[2] *
                100
            );


    roundScoresDisplay.innerHTML =

        "1回目：" +
        roundScores[0] +
        "点 / HIT率：" +
        round1Rate +
        "%<br>" +

        "2回目：" +
        roundScores[1] +
        "点 / HIT率：" +
        round2Rate +
        "%<br>" +

        "3回目：" +
        roundScores[2] +
        "点 / HIT率：" +
        round3Rate +
        "%<br><br>" +

        "合計：" +
        totalScore +
        "点<br>" +

        "3回合計HIT率：" +
        totalHitRate +
        "%";

}


/* =========================
   初期表示
========================= */

updateRoundScores();

updateHitRate();

</script>


<!-- =========================
     Firebase
========================= -->

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
    getDatabase,
    ref,
    set
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


/* =========================
   Firebase設定
========================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyBrv8In8AGaFNSMj1CSremQ8CxeQkzrfCg",

    authDomain:
        "shooting-galaxy.firebaseapp.com",

    databaseURL:
        "https://shooting-galaxy-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
        "shooting-galaxy",

    storageBucket:
        "shooting-galaxy.firebasestorage.app",

    messagingSenderId:
        "294093816088",

    appId:
        "1:294093816088:web:a18a7966391d60e2209e6d"

};


/* =========================
   Firebase開始
========================= */

const app =
    initializeApp(firebaseConfig);

const database =
    getDatabase(app);


/* =========================
   Firebaseへ送信
========================= */

window.sendToFirebase = function() {

    if (station === "") {
        return;
    }


    if (participantNumber.value === "") {
        return;
    }


    const participant =
        participantNumber.value.trim();


    const totalScore =
        roundScores[0] +
        roundScores[1] +
        roundScores[2];


    const totalShots =
        roundShots[0] +
        roundShots[1] +
        roundShots[2];


    const totalHits =
        roundHits[0] +
        roundHits[1] +
        roundHits[2];


    const totalHitRate =
        totalShots === 0
            ? 0
            : Math.round(
                totalHits /
                totalShots *
                100
            );


    const data = {

        station:
            station,

        participant:
            participant,

        round:
            currentRound,

        score:
            score,

        shots:
            shots,

        hits:
            hits,

        hitRate:
            shots === 0
                ? 0
                : Math.round(
                    hits /
                    shots *
                    100
                ),

        totalShots:
            totalShots,

        totalHits:
            totalHits,

        totalHitRate:
            totalHitRate,

        totalScore:
            totalScore,

        status:
            status.textContent,

        timeLeft:
            timeLeft,

        roundScores:
            roundScores,

        roundShots:
            roundShots,

        roundHits:
            roundHits,

        updatedAt:
            Date.now()

    };


    set(

        ref(
            database,
            "scores/" +
            participant +
            "/" +
            station
        ),

        data

    )
    .then(function() {

        console.log(
            "Firebase送信成功:",
            participant,
            station
        );

    })
    .catch(function(error) {

        console.error(
            "Firebase送信エラー:",
            error
        );

    });

};

</script>


</body>
</html>
