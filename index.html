<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GALAXY SHOTTER</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #000;
        color: #fff;
        font-family: Arial, "Hiragino Kaku Gothic ProN", sans-serif;
        text-align: center;
    }

    .container {
        width: 100%;
        max-width: 700px;
        margin: 0 auto;
        padding: 20px;
    }

    h1 {
        font-size: 42px;
        margin: 10px 0 25px;
    }

    .participant-area {
        margin-bottom: 25px;
    }

    .participant-area input {
        width: 260px;
        padding: 14px;
        font-size: 22px;
        text-align: center;
        border: 2px solid #fff;
        border-radius: 10px;
        background: #000;
        color: #fff;
    }

    .round-title {
        font-size: 28px;
        margin: 20px 0;
    }

    .score {
        font-size: 60px;
        font-weight: bold;
        margin: 15px 0;
    }

    .info {
        font-size: 24px;
        margin: 12px 0;
    }

    .hit-rate {
        font-size: 28px;
        margin: 15px 0 25px;
    }

    .score-buttons {
        display: flex;
        justify-content: center;
        gap: 20px;
        flex-wrap: wrap;
        margin-bottom: 20px;
    }

    button {
        color: #fff;
        background: #000;
        border: 2px solid #fff;
        border-radius: 12px;
        padding: 18px 30px;
        font-size: 25px;
        cursor: pointer;
        min-width: 150px;
    }

    button:active {
        background: #fff;
        color: #000;
    }

    button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    .miss {
        margin-bottom: 20px;
    }

    .end-button {
        margin-top: 10px;
        min-width: 250px;
    }

    .next-button {
        margin-top: 20px;
        min-width: 280px;
    }

    .result {
        margin-top: 35px;
        padding-top: 25px;
        border-top: 2px solid #fff;
    }

    .result h2 {
        font-size: 30px;
        margin-bottom: 25px;
    }

    .round-result {
        font-size: 22px;
        margin: 12px 0;
    }

    .total {
        margin-top: 30px;
        font-size: 28px;
        font-weight: bold;
    }

    .status {
        margin-top: 25px;
        font-size: 20px;
    }

    @media (max-width: 600px) {
        h1 {
            font-size: 32px;
        }

        .score {
            font-size: 50px;
        }

        button {
            min-width: 130px;
            padding: 15px 20px;
            font-size: 21px;
        }
    }
</style>
</head>

<body>

<div class="container">

    <h1>GALAXY SHOTTER</h1>

    <!-- Challenger番号 -->
    <div class="participant-area">
        <input
            type="text"
            id="participantNumber"
            placeholder="Challenger番号"
            inputmode="numeric"
            maxlength="4"
            oninput="this.value = this.value.replace(/[^0-9]/g, '')"
        >
    </div>

    <!-- 現在のラウンド -->
    <div class="round-title" id="roundTitle">
        1ラウンド目
    </div>

    <!-- 現在の点数 -->
    <div class="score" id="score">
        0
    </div>

    <div class="info">
        発射数：<span id="shots">0</span>
    </div>

    <div class="info">
        HIT数：<span id="hits">0</span>
    </div>

    <div class="hit-rate">
        HIT率：<span id="hitRate">0%</span>
    </div>

    <!-- 得点ボタン -->
    <div class="score-buttons">

        <button onclick="addScore(10)">
            10点
        </button>

        <button onclick="addScore(50)">
            50点
        </button>

        <button onclick="addScore(100)">
            100点
        </button>

    </div>

    <!-- MISS -->
    <div class="miss">
        <button onclick="miss()">
            MISS
        </button>
    </div>

    <!-- ラウンド終了 -->
    <button
        class="end-button"
        onclick="endRound()"
        id="endButton">
        ラウンド終了
    </button>

    <!-- 3ラウンド結果 -->
    <div class="result">

        <h2>3ラウンド結果</h2>

        <div class="round-result">
            1回目：
            <span id="round1Score">0</span>点 /
            <span id="round1Rate">0</span>%
        </div>

        <div class="round-result">
            2回目：
            <span id="round2Score">0</span>点 /
            <span id="round2Rate">0</span>%
        </div>

        <div class="round-result">
            3回目：
            <span id="round3Score">0</span>点 /
            <span id="round3Rate">0</span>%
        </div>

        <div class="total">
            合計：
            <span id="totalScore">0</span>点
        </div>

        <div class="total">
            3回合計HIT率：
            <span id="totalHitRate">0</span>%
        </div>

    </div>

    <!-- 次のChallenger -->
    <button
        class="next-button"
        onclick="nextChallenger()">
        次のChallenger
    </button>

    <div class="status" id="status">
        Challenger番号を入力してください
    </div>

</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getDatabase,
    ref,
    set
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


// =====================================
// このiPadの台番号
// =====================================

// 台1のiPadなら「台1」
const STATION = "台1";


// =====================================
// Firebase設定
// =====================================

const firebaseConfig = {
    apiKey: "ここに今まで使っていたAPIキー",
    authDomain: "shooting-galaxy.firebaseapp.com",
    databaseURL: "https://shooting-galaxy-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "shooting-galaxy",
    storageBucket: "shooting-galaxy.firebasestorage.app",
    messagingSenderId: "294093816088",
    appId: "1:294093816088:web:a18a7966391d60e2209e6d"
};

const app = initializeApp(firebaseConfig);
const database = getDatabase(app);


// =====================================
// ゲーム変数
// =====================================

let currentRound = 1;

let score = 0;
let shots = 0;
let hits = 0;

let roundScores = [0, 0, 0];
let roundShots = [0, 0, 0];
let roundHits = [0, 0, 0];


// =====================================
// Challenger番号
// =====================================

function normalizeParticipantNumber() {

    const input =
        document
            .getElementById("participantNumber")
            .value
            .trim();

    if (input === "") {

        alert("Challenger番号を入力してください。");

        return null;
    }

    const number = Number(input);

    if (
        !Number.isInteger(number) ||
        number < 1 ||
        number > 9999
    ) {

        alert(
            "Challenger番号は1〜9999で入力してください。"
        );

        return null;
    }

    return String(number).padStart(4, "0");
}


// =====================================
// HIT率計算
// =====================================

function calculateHitRate(h, s) {

    if (s === 0) {
        return 0;
    }

    return Math.round((h / s) * 100);
}


// =====================================
// 画面更新
// =====================================

function updateDisplay() {

    document.getElementById("roundTitle").textContent =
        currentRound + "ラウンド目";

    document.getElementById("score").textContent =
        score;

    document.getElementById("shots").textContent =
        shots;

    document.getElementById("hits").textContent =
        hits;

    document.getElementById("hitRate").textContent =
        calculateHitRate(hits, shots) + "%";


    // 1回目
    document.getElementById("round1Score").textContent =
        roundScores[0];

    document.getElementById("round1Rate").textContent =
        calculateHitRate(
            roundHits[0],
            roundShots[0]
        );


    // 2回目
    document.getElementById("round2Score").textContent =
        roundScores[1];

    document.getElementById("round2Rate").textContent =
        calculateHitRate(
            roundHits[1],
            roundShots[1]
        );


    // 3回目
    document.getElementById("round3Score").textContent =
        roundScores[2];

    document.getElementById("round3Rate").textContent =
        calculateHitRate(
            roundHits[2],
            roundShots[2]
        );


    // 合計点
    const totalScore =
        roundScores[0] +
        roundScores[1] +
        roundScores[2];

    document.getElementById("totalScore").textContent =
        totalScore;


    // 3ラウンド合計HIT率
    const totalShots =
        roundShots[0] +
        roundShots[1] +
        roundShots[2];

    const totalHits =
        roundHits[0] +
        roundHits[1] +
        roundHits[2];

    document.getElementById("totalHitRate").textContent =
        calculateHitRate(
            totalHits,
            totalShots
        );
}


// =====================================
// 得点
// =====================================

window.addScore = function(points) {

    score += points;

    shots++;

    hits++;

    roundScores[currentRound - 1] += points;

    roundShots[currentRound - 1]++;

    roundHits[currentRound - 1]++;

    updateDisplay();
};


// =====================================
// MISS
// =====================================

window.miss = function() {

    shots++;

    roundShots[currentRound - 1]++;

    updateDisplay();
};


// =====================================
// ラウンド終了
// =====================================

window.endRound = async function() {

    const participant =
        normalizeParticipantNumber();

    if (!participant) {
        return;
    }


    await saveToFirebase(participant);


    // 3ラウンド目終了
    if (currentRound === 3) {

        document.getElementById("status").textContent =
            "3ラウンド終了！";

        document.getElementById("endButton").disabled =
            true;

        return;
    }


    // 次のラウンド
    currentRound++;

    score = 0;
    shots = 0;
    hits = 0;

    document.getElementById("status").textContent =
        currentRound + "ラウンド目開始";

    updateDisplay();
};


// =====================================
// Firebase保存
// =====================================

async function saveToFirebase(participant) {

    const totalScore =
        roundScores[0] +
        roundScores[1] +
        roundScores[2];

    const totalShots =
        roundShots[0] +
        roundShots[1] +
        roundShots[2];

    const totalHits =
        roundHits[0] +
        roundHits[1] +
        roundHits[2];

    const totalHitRate =
        calculateHitRate(
            totalHits,
            totalShots
        );


    const data = {

        station: STATION,

        participant: participant,

        round: currentRound,

        score: score,

        shots: shots,

        hits: hits,

        hitRate: calculateHitRate(
            hits,
            shots
        ),

        totalScore: totalScore,

        totalShots: totalShots,

        totalHits: totalHits,

        totalHitRate: totalHitRate,

        roundScores: roundScores,

        roundShots: roundShots,

        roundHits: roundHits,

        updatedAt: Date.now()
    };


    try {

        await set(
            ref(
                database,
                "scores/" +
                participant +
                "/" +
                STATION
            ),
            data
        );

        document.getElementById("status").textContent =
            "保存しました";

    } catch (error) {

        console.error(error);

        document.getElementById("status").textContent =
            "保存に失敗しました";
    }
}


// =====================================
// 次のChallenger
// =====================================

window.nextChallenger = function() {

    currentRound = 1;

    score = 0;
    shots = 0;
    hits = 0;

    roundScores = [0, 0, 0];
    roundShots = [0, 0, 0];
    roundHits = [0, 0, 0];

    document.getElementById("participantNumber").value =
        "";

    document.getElementById("endButton").disabled =
        false;

    document.getElementById("status").textContent =
        "Challenger番号を入力してください";

    updateDisplay();
};


// =====================================
// 初期表示
// =====================================

updateDisplay();

</script>

</body>
</html>
