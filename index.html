<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHOOTING GALAXY</title>

  <style>
    body {
      margin: 0;
      background: #000000;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      font-size: 40px;
      margin-top: 30px;
    }

    #status {
      font-size: 28px;
      margin: 20px;
    }

    #timer {
      font-size: 70px;
      font-weight: bold;
      margin: 20px;
    }

    #score {
      font-size: 50px;
      margin: 20px;
    }

    #round {
      font-size: 25px;
      margin: 15px;
    }

    button {
      font-size: 25px;
      padding: 15px 25px;
      margin: 8px;
      border-radius: 10px;
      border: 2px solid white;
      background: black;
      color: white;
    }

    button:active {
      background: white;
      color: black;
    }

    .score-buttons {
      margin-top: 20px;
    }

    #roundScores {
      font-size: 22px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <h1>SHOOTING GALAXY</h1>

  <div id="status">集計開始</div>

  <div id="round">1回目</div>

  <div id="timer">50</div>

  <div id="score">0</div>

  <div class="score-buttons">
    <button onclick="addScore(10)">10</button>
    <button onclick="addScore(20)">20</button>
    <button onclick="addScore(30)">30</button>
    <button onclick="addScore(50)">50</button>
    <button onclick="addScore(100)">100</button>
    <br>
    <button onclick="miss()">MISS</button>
  </div>

  <div>
    <button onclick="startGame()">集計開始</button>
    <button onclick="nextRound()">次のラウンド</button>
    <button onclick="nextCustomer()">次のお客様</button>
  </div>

  <div id="roundScores">
    1回目：0点<br>
    2回目：0点<br>
    3回目：0点<br>
    合計：0点
  </div>

  <script>
    let currentRound = 1;
    let timeLeft = 50;
    let score = 0;
    let shots = 0;
    let timer = null;
    let gameRunning = false;

    let roundScores = [0, 0, 0];

    const status = document.getElementById("status");
    const timerDisplay = document.getElementById("timer");
    const scoreDisplay = document.getElementById("score");
    const roundDisplay = document.getElementById("round");
    const roundScoresDisplay = document.getElementById("roundScores");

    function startGame() {
      if (gameRunning) return;

      gameRunning = true;
      timeLeft = 50;
      score = 0;
      shots = 0;

      scoreDisplay.textContent = score;
      timerDisplay.textContent = timeLeft;
      status.textContent = "集計中";
      roundDisplay.textContent = currentRound + "回目";

      timer = setInterval(() => {
        timeLeft--;

        timerDisplay.textContent = timeLeft;

        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);
    }

    function addScore(points) {
      if (!gameRunning) return;

      score += points;
      shots++;

      scoreDisplay.textContent = score;
    }

    function miss() {
      if (!gameRunning) return;

      shots++;
    }

    function endGame() {
      clearInterval(timer);
      timer = null;
      gameRunning = false;

      roundScores[currentRound - 1] = score;

      status.textContent = currentRound + "回 FINISH";

      updateRoundScores();
    }

    function nextRound() {
      if (gameRunning) return;

      if (currentRound >= 3) {
        status.textContent = "3回 FINISH";
        return;
      }

      currentRound++;

      timeLeft = 50;
      score = 0;
      shots = 0;

      timerDisplay.textContent = timeLeft;
      scoreDisplay.textContent = score;
      roundDisplay.textContent = currentRound + "回目";

      status.textContent = "集計開始";
    }

    function nextCustomer() {
      clearInterval(timer);

      currentRound = 1;
      timeLeft = 50;
      score = 0;
      shots = 0;
      gameRunning = false;

      roundScores = [0, 0, 0];

      timerDisplay.textContent = timeLeft;
      scoreDisplay.textContent = score;
      roundDisplay.textContent = "1回目";
      status.textContent = "集計開始";

      updateRoundScores();
    }

    function updateRoundScores() {
      const total =
        roundScores[0] +
        roundScores[1] +
        roundScores[2];

      roundScoresDisplay.innerHTML =
        "1回目：" + roundScores[0] + "点<br>" +
        "2回目：" + roundScores[1] + "点<br>" +
        "3回目：" + roundScores[2] + "点<br>" +
        "合計：" + total + "点";
    }
  </script>

</body>
</html>
