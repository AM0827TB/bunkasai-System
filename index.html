<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SHOOTING GALAXY</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #000000;
    color: #ffffff;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    font-size: 42px;
    margin: 20px 0 30px;
}

#stationArea {
    margin: 20px auto;
    padding: 20px;
    max-width: 500px;
    border: 2px solid #ffffff;
    border-radius: 12px;
}

#stationTitle {
    font-size: 24px;
    margin-bottom: 12px;
}

#stationSelect {
    font-size: 25px;
    padding: 10px 20px;
    background: #000000;
    color: #ffffff;
    border: 2px solid #ffffff;
    border-radius: 8px;
}

#stationDisplay {
    font-size: 25px;
    margin: 20px;
}

#participantArea {
    margin: 20px;
}

#participantNumber {
    font-size: 25px;
    width: 220px;
    padding: 12px;
    text-align: center;
    background: #000000;
    color: #ffffff;
    border: 2px solid #ffffff;
    border-radius: 8px;
}

#participantDisplay {
    font-size: 24px;
    margin: 15px;
}

#status {
    font-size: 30px;
    font-weight: bold;
    margin: 25px;
}

#round {
    font-size: 30px;
    font-weight: bold;
    margin: 15px;
}

#timer {
    font-size: 75px;
    font-weight: bold;
    margin: 20px;
}

#score {
    font-size: 70px;
    font-weight: bold;
    margin: 20px;
}

#shots {
    font-size: 25px;
    margin-bottom: 20px;
}

button {
    font-size: 25px;
    padding: 18px 25px;
    margin: 8px;
    border-radius: 12px;
    border: 2px solid #ffffff;
    background: #000000;
    color: #ffffff;
}

button:active {
    background: #ffffff;
    color: #000000;
}

.scoreButton {
    min-width: 130px;
}

#miss {
    width: 290px;
}

#start {
    font-size: 30px;
    margin-top: 20px;
}

#nextRound {
    font-size: 25px;
}

#reset {
    font-size: 23px;
    margin-top: 25px;
}

#roundScores {
    font-size: 23px;
    line-height: 1.8;
    margin: 30px 0;
    padding-bottom: 30px;
}

</style>
</head>

<body>

<h1>SHOOTING GALAXY</h1>


<!-- 担当台 -->

<div id="stationArea">

    <div id="stationTitle">
        担当台を選択
    </div>

    <select id="stationSelect" onchange="setStation()">

        <option value="">
            選択してください
        </option>

        <option value="台1">
            台1
        </option>

        <option value="台2">
            台2
        </option>

        <option value="台3">
            台3
        </option>

    </select>

</div>


<div id="stationDisplay">
    担当台：未設定
</div>


<!-- Challenger番号 -->

<div id="participantArea">

    <input
        type="number"
        id="participantNumber"
        placeholder="Challenger番号"
        min="1"
    >

</div>


<div id="participantDisplay">
    Challenger番号：未入力
</div>


<!-- 状態 -->

<div id="status">
    集計開始
</div>


<!-- 回数 -->

<div id="round">
    1回目
</div>


<!-- タイマー -->

<div id="timer">
    50
</div>


<!-- 得点 -->

<div id="score">
    0
</div>


<!-- 発射数 -->

<div id="shots">
    発射数：0
</div>


<!-- 得点ボタン -->

<div>

    <button
        class="scoreButton"
        onclick="addScore(10)">
        10点
    </button>

    <button
        class="scoreButton"
        onclick="addScore(20)">
        20点
    </button>

</div>


<div>

    <button
        class="scoreButton"
        onclick="addScore(30)">
        30点
    </button>

    <button
        class="scoreButton"
        onclick="addScore(50)">
        50点
    </button>

</div>


<div>

    <button
        class="scoreButton"
        onclick="addScore(100)">
        100点
    </button>

</div>


<!-- MISS -->

<div>

    <button
        id="miss"
        onclick="miss()">
        MISS
    </button>

</div>


<!-- 集計開始 -->

<div>

    <button
        id="start"
        onclick="startGame()">
        集計開始
    </button>

</div>


<!-- 次のラウンド -->

<div>

    <button
        id="nextRound"
        onclick="nextRound()"
        style="display:none;">
        次のラウンド
    </button>

</div>


<!-- 次のChallenger -->

<div>

    <button
        id="reset"
        onclick="nextCustomer()">
        次のChallenger
    </button>

</div>


<!-- 各回の結果 -->

<div id="roundScores">

    1回目：0点<br>
    2回目：0点<br>
    3回目：0点<br><br>
    合計：0点

</div>


<script>

/* =========================
   基本設定
========================= */

let station = "";

let currentRound = 1;

let timeLeft = 50;

let score = 0;

let shots = 0;

let timer = null;

let gameRunning = false;

let roundScores = [0, 0, 0];


/* =========================
   HTML要素
========================= */

const status =
    document.getElementById("status");

const timerDisplay =
    document.getElementById("timer");

const scoreDisplay =
    document.getElementById("score");

const roundDisplay =
    document.getElementById("round");

const shotsDisplay =
    document.getElementById("shots");

const roundScoresDisplay =
    document.getElementById("roundScores");

const participantNumber =
    document.getElementById("participantNumber");

const participantDisplay =
    document.getElementById("participantDisplay");

const stationSelect =
    document.getElementById("stationSelect");

const stationDisplay =
    document.getElementById("stationDisplay");

const startButton =
    document.getElementById("start");

const nextRoundButton =
    document.getElementById("nextRound");


/* =========================
   台番号設定
========================= */

function setStation() {

    station = stationSelect.value;

    if (station === "") {

        stationDisplay.textContent =
            "担当台：未設定";

        return;
    }

    stationDisplay.textContent =
        "担当台：" + station;

}


/* =========================
   集計開始
========================= */

function startGame() {

    if (gameRunning) {
        return;
    }


    if (station === "") {

        alert("担当台を選択してください");

        return;
    }


    if (participantNumber.value === "") {

        alert("Challenger番号を入力してください");

        return;
    }


    participantDisplay.textContent =
        "Challenger番号：" +
        participantNumber.value;


    gameRunning = true;


    timeLeft = 50;

    score = 0;

    shots = 0;


    scoreDisplay.textContent =
        score;

    shotsDisplay.textContent =
        "発射数：" + shots;

    timerDisplay.textContent =
        timeLeft;


    status.textContent =
        "集計中";


    roundDisplay.textContent =
        currentRound + "回目";


    startButton.style.display =
        "none";

    nextRoundButton.style.display =
        "none";


    if (window.sendToFirebase) {
        window.sendToFirebase();
    }


    timer = setInterval(function() {

        timeLeft--;

        timerDisplay.textContent =
            timeLeft;


        if (timeLeft <= 0) {

            endGame();

        }

    }, 1000);

}


/* =========================
   得点追加
========================= */

function addScore(points) {

    if (!gameRunning) {
        return;
    }


    score += points;

    shots++;


    scoreDisplay.textContent =
        score;

    shotsDisplay.textContent =
        "発射数：" + shots;


    if (window.sendToFirebase) {
        window.sendToFirebase();
    }

}


/* =========================
   MISS
========================= */

function miss() {

    if (!gameRunning) {
        return;
    }


    shots++;


    shotsDisplay.textContent =
        "発射数：" + shots;


    if (window.sendToFirebase) {
        window.sendToFirebase();
    }

}


/* =========================
   ラウンド終了
========================= */

function endGame() {

    clearInterval(timer);

    timer = null;

    gameRunning = false;


    roundScores[currentRound - 1] =
        score;


    status.textContent =
        currentRound + "回 FINISH";


    updateRoundScores();


    if (currentRound < 3) {

        nextRoundButton.style.display =
            "inline-block";

    } else {

        status.textContent =
            "3回 FINISH";

    }


    if (window.sendToFirebase) {
        window.sendToFirebase();
    }

}


/* =========================
   次のラウンド
========================= */

function nextRound() {

    if (gameRunning) {
        return;
    }


    if (currentRound >= 3) {

        status.textContent =
            "3回 FINISH";

        return;
    }


    currentRound++;


    timeLeft = 50;

    score = 0;

    shots = 0;


    timerDisplay.textContent =
        timeLeft;

    scoreDisplay.textContent =
        score;

    shotsDisplay.textContent =
        "発射数：" + shots;


    roundDisplay.textContent =
        currentRound + "回目";


    status.textContent =
        "集計開始";


    nextRoundButton.style.display =
        "none";

    startButton.style.display =
        "inline-block";


    if (window.sendToFirebase) {
        window.sendToFirebase();
    }

}


/* =========================
   次のChallenger
========================= */

function nextCustomer() {

    clearInterval(timer);

    timer = null;


    currentRound = 1;

    timeLeft = 50;

    score = 0;

    shots = 0;


    gameRunning = false;


    roundScores =
        [0, 0, 0];


    participantNumber.value =
        "";


    participantDisplay.textContent =
        "Challenger番号：未入力";


    timerDisplay.textContent =
        timeLeft;

    scoreDisplay.textContent =
        score;

    shotsDisplay.textContent =
        "発射数：0";


    roundDisplay.textContent =
        "1回目";


    status.textContent =
        "集計開始";


    startButton.style.display =
        "inline-block";


    nextRoundButton.style.display =
        "none";


    updateRoundScores();

}


/* =========================
   各回の得点表示
========================= */

function updateRoundScores() {

    const total =
        roundScores[0] +
        roundScores[1] +
        roundScores[2];


    roundScoresDisplay.innerHTML =

        "1回目：" +
        roundScores[0] +
        "点<br>" +

        "2回目：" +
        roundScores[1] +
        "点<br>" +

        "3回目：" +
        roundScores[2] +
        "点<br><br>" +

        "合計：" +
        total +
        "点";

}


/* =========================
   初期表示
========================= */

updateRoundScores();

</script>


<!-- =========================
     Firebase
========================= -->

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
    getDatabase,
    ref,
    set
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


/* =========================
   Firebase設定
========================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyBrv8InAGFNSMj1CSrem9Q8CxeQkzrfCg",

    authDomain:
        "shooting-galaxy.firebaseapp.com",

    databaseURL:
        "https://shooting-galaxy-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
        "shooting-galaxy",

    storageBucket:
        "shooting-galaxy.firebasestorage.app",

    messagingSenderId:
        "294093816088",

    appId:
        "1:294093816088:web:a18a7966391d60e2209e6d"

};


/* =========================
   Firebase開始
========================= */

const app =
    initializeApp(firebaseConfig);

const database =
    getDatabase(app);


/* =========================
   Firebaseへ送信
========================= */

window.sendToFirebase = function() {

    if (station === "") {
        return;
    }


    if (participantNumber.value === "") {
        return;
    }


    const participant =
        participantNumber.value;


    const totalScore =
        roundScores[0] +
        roundScores[1] +
        roundScores[2];


    const data = {

        station:
            station,

        participant:
            participant,

        round:
            currentRound,

        score:
            score,

        shots:
            shots,

        totalScore:
            totalScore,

        status:
            status.textContent,

        timeLeft:
            timeLeft,

        roundScores:
            roundScores,

        updatedAt:
            Date.now()

    };


    set(

        ref(
            database,
            "scores/" +
            participant +
            "/" +
            station
        ),

        data

    )
    .catch(function(error) {

        console.error(
            "Firebase送信エラー:",
            error
        );

    });

};

</script>


</body>
</html>
